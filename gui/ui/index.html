<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Cleaner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Dev Cleaner</h1>
  <span class="sub">Caches, extensões e artefatos de linguagens, IDEs e projetos</span>
</header>

<section class="panel opts">
  <label><input type="checkbox" id="opt-lang" checked> Linguagens</label>
  <label><input type="checkbox" id="opt-ide" checked> IDEs/Editores</label>
  <label class="root">Pasta de projetos
    <input type="text" id="opt-root" placeholder="ex.: E:\Git (vazio = não procurar)">
  </label>
  <label>Profundidade <input type="number" id="opt-depth" value="6" min="1" max="20"></label>
  <button id="btn-scan" class="primary">Analisar</button>
</section>

<div id="progress" class="progress hidden"><div id="bar"></div><span id="progress-text"></span></div>

<section class="panel toolbar hidden" id="toolbar">
  <select id="filter">
    <option value="">Todos os tipos</option>
    <option value="Language">Linguagem</option>
    <option value="Ide">IDE/Editor</option>
    <option value="LocalProject">Projeto Local</option>
  </select>
  <button id="btn-all">Marcar visíveis</button>
  <button id="btn-none">Desmarcar tudo</button>
  <span id="summary" class="grow"></span>
  <button id="btn-clean" class="danger" disabled>Remover selecionados</button>
</section>

<main>
  <table id="table" class="hidden">
    <thead><tr><th></th><th>Tipo</th><th>Nome</th><th>Caminho</th><th class="num">Arquivos</th><th class="num">Tamanho</th></tr></thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="muted">Clique em “Analisar” para começar.</p>
</main>

<section id="log" class="panel hidden"><strong>Avisos</strong><ul></ul></section>

<div id="modal" class="modal hidden">
  <div class="dialog">
    <h2>Confirmar remoção</h2>
    <p id="modal-text"></p>
    <div id="critical-box" class="hidden">
      <p class="warn">⚠ Itens críticos selecionados (serão perdidos e precisarão ser reinstalados):</p>
      <ul id="critical-list"></ul>
      <p>Digite <b>APAGAR</b> para confirmar:</p>
      <input type="text" id="critical-input" autocomplete="off">
    </div>
    <div class="actions">
      <button id="modal-cancel">Cancelar</button>
      <button id="modal-ok" class="danger">Remover</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
