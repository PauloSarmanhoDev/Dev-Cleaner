<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F141C">
<title>Scour</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1 class="brand-title" aria-label="Scour">
      <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 256" role="img" aria-hidden="true">
        <g id="symbol">
          <g id="storage-stack" fill="var(--logo-stack)" fill-rule="evenodd">
            <path d="M 28 16 H 172 L 184 28 V 46 L 172 58 H 28 L 16 46 V 28 Z M 34 31 H 56 V 43 H 34 Z" />
            <path d="M 28 74 H 104 L 78 100 V 116 H 28 L 16 104 V 86 Z M 34 89 H 56 V 101 H 34 Z" />
            <path d="M 28 132 H 78 V 148 L 104 174 H 28 L 16 162 V 144 Z M 34 147 H 56 V 159 H 34 Z" />
          </g>
          <g id="s-chisel">
            <path id="s-blade-upper" fill="var(--logo-upper)" d="M 128 72 H 240 L 206 106 H 140 L 126 120 V 139 H 172 L 138 173 H 118 L 92 147 V 108 Z" />
            <path id="s-blade-lower" fill="var(--logo-lower)" d="M 204 240 H 92 L 126 206 H 192 L 206 192 V 173 H 160 L 194 139 H 214 L 240 165 V 204 Z" />
          </g>
        </g>
        <g id="wordmark" fill="var(--logo-lower)" fill-rule="evenodd">
          <path d="M 324 64 H 400 L 372 92 H 332 V 114 H 380 L 400 134 V 172 L 380 192 H 304 L 332 164 H 372 V 142 H 324 L 304 122 V 84 Z M 446 64 H 514 L 486 92 H 456 L 450 98 V 158 L 456 164 H 486 L 514 192 H 446 L 422 168 V 88 Z M 556 64 H 608 L 632 88 V 168 L 608 192 H 556 L 532 168 V 88 Z M 568 92 L 560 100 V 156 L 568 164 H 596 L 604 156 V 100 L 596 92 Z M 656 64 H 684 V 156 L 692 164 H 720 L 728 156 V 64 H 756 V 168 L 732 192 H 680 L 656 168 Z M 780 64 H 856 L 876 84 V 120 L 856 140 H 844 L 896 192 H 856 L 808 144 V 192 H 780 Z M 808 90 V 116 H 842 L 848 110 V 96 L 842 90 Z" />
        </g>
      </svg>
    </h1>
    <span class="sub" data-i18n="subtitle"></span>
  </div>
  <div class="header-actions">
    <select id="lang"><option value="pt">Português</option><option value="en">English</option></select>
    <button id="btn-supported" data-i18n="supported"></button>
    <button id="btn-settings" data-i18n="settings"></button>
    <button id="btn-theme" title="Tema">◐</button>
  </div>
</header>

<section class="panel opts">
  <label><input type="checkbox" id="opt-lang" checked> <span data-i18n="opt_lang"></span></label>
  <label><input type="checkbox" id="opt-ide" checked> <span data-i18n="opt_ide"></span></label>
  <label class="root"><span data-i18n="opt_root"></span>
    <input type="text" id="opt-root" data-i18n-ph="opt_root_ph">
    <button id="btn-pick" data-i18n="pick"></button>
  </label>
  <label><span data-i18n="opt_depth"></span> <input type="number" id="opt-depth" value="6" min="1" max="20"></label>
  <label><span data-i18n="opt_older"></span> <input type="text" id="opt-older" size="5" placeholder="30d"></label>
  <label title=""><input type="checkbox" id="opt-perm"> <span data-i18n="opt_perm"></span></label>
  <button id="btn-scan" class="primary" data-i18n="scan"></button>
  <button id="btn-cache" data-i18n="use_cache"></button>
</section>

<div id="progress" class="progress hidden">
  <div id="bar"></div><span id="progress-text"></span>
  <button id="btn-cancel" data-i18n="cancel"></button>
</div>

<section id="chart" class="panel hidden"></section>

<section class="panel toolbar hidden" id="toolbar">
  <select id="filter"></select>
  <button id="btn-all" data-i18n="sel_visible"></button>
  <button id="btn-none" data-i18n="sel_none"></button>
  <span id="summary" class="grow"></span>
  <button id="btn-clean" class="danger" disabled data-i18n="remove"></button>
</section>

<main>
  <table id="table" class="hidden">
    <thead><tr>
      <th></th>
      <th data-sort="category" data-i18n="h_type"></th>
      <th data-sort="name" data-i18n="h_name"></th>
      <th data-sort="path" data-i18n="h_path"></th>
      <th data-sort="files" class="num" data-i18n="h_files"></th>
      <th data-sort="size" class="num" data-i18n="h_size"></th>
      <th data-sort="last_used" class="num" data-i18n="h_used"></th>
      <th></th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="muted"></p>
</main>

<section id="log" class="panel hidden"><strong data-i18n="warnings"></strong><ul></ul></section>
<footer class="foot muted"><span id="audit"></span></footer>

<div id="modal" class="modal hidden">
  <div class="dialog">
    <h2 data-i18n="confirm_title"></h2>
    <p id="modal-text"></p>
    <div id="running-box" class="hidden">
      <p class="warn" data-i18n="running_warn"></p>
      <ul id="running-list"></ul>
      <label><input type="checkbox" id="running-ok"> <span data-i18n="running_continue"></span></label>
    </div>
    <div id="critical-box" class="hidden">
      <p class="warn" data-i18n="critical_warn"></p>
      <ul id="critical-list"></ul>
      <p><span data-i18n="type_word"></span> <b id="critical-word"></b></p>
      <input type="text" id="critical-input" autocomplete="off">
    </div>
    <div class="actions">
      <button id="modal-cancel" data-i18n="cancel"></button>
      <button id="modal-ok" class="danger" data-i18n="remove_btn"></button>
    </div>
  </div>
</div>

<div id="msg-modal" class="modal hidden">
  <div class="dialog">
    <h2 id="msg-title"></h2>
    <p id="msg-text" class="pre"></p>
    <div class="actions"><button id="msg-ok" class="primary" data-i18n="ok"></button></div>
  </div>
</div>

<div id="supported-modal" class="modal hidden">
  <div class="dialog wide">
    <h2 data-i18n="supported_title"></h2>
    <span id="supported-count" class="muted"></span>
    <div class="scroll">
      <table id="supported-table">
        <thead><tr><th data-i18n="h_type"></th><th data-i18n="h_name"></th><th data-i18n="h_what"></th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="actions"><button id="supported-close" data-i18n="close"></button></div>
  </div>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="dialog wide">
    <h2 data-i18n="settings_title"></h2>
    <span id="cfg-path" class="muted"></span>
    <p id="cfg-warn" class="warn"></p>
    <label><span data-i18n="cfg_lang"></span> <select id="cfg-lang"></select></label>
    <label><span data-i18n="cfg_older"></span> <input type="text" id="cfg-older" size="6" placeholder="30d"></label>
    <label><input type="checkbox" id="cfg-perm"> <span data-i18n="cfg_perm"></span></label>
    <label class="col"><span data-i18n="cfg_exclude"></span> <textarea id="cfg-exclude" rows="4" spellcheck="false"></textarea></label>
    <div><strong data-i18n="cfg_extra"></strong> <button id="cfg-add" data-i18n="cfg_add"></button></div>
    <div id="extras-box"></div>
    <span class="muted" data-i18n="cfg_note"></span>
    <p id="cfg-error" class="warn"></p>
    <div class="actions">
      <button id="cfg-cancel" data-i18n="cancel"></button>
      <button id="cfg-save" class="primary" data-i18n="save"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
